name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: mvn --batch-mode test -Dtest=AllFeaturesRunner -Dbase.url=${{vars.BASE_URL}} -Dwebdriver.browser=${{vars.WEBDRIVER_BROWSER}} -Dreport=${{vars.REPORTER || 'allure'}}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: output
